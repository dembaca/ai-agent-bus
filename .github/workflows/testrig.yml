name: testrig

# The fault-run harness has its own project and its own job (condition 1 of
# the build order's approval): a move that touches mcp/pyproject.toml does not
# touch this job's own files, and a change here runs only here.
#
# `mcp/**` is in both path lists (follow-up review point 1) although none of
# this job's files change with it: the harness measures the bus, so a bus
# change must run it. Without that, a change under `mcp/` that adds a Mattermost
# call merges green — the stand-in does not know it yet — and the *next* testrig
# PR fails on "unknown call", far from the change that caused it.
#
# Actions are pinned to a commit SHA (review point 16): a tag can be moved, a
# SHA cannot, and this job runs on every PR.

on:
  push:
    branches: [main]
    paths: ["testrig/**", "mcp/**", ".github/workflows/testrig.yml"]
  pull_request:
    paths: ["testrig/**", "mcp/**", ".github/workflows/testrig.yml"]
  # The full runs of ADR-014 phase 4 (100 messages per fault, 50 hard stops) take
  # hours: by hand and nightly, never on a PR.
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  harness:
    # A PR or push runs the small harness; the schedule and a manual dispatch run
    # the full job below instead.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: testrig
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          enable-cache: true

      - name: ruff
        run: uvx --from ruff@0.17.2 ruff check

      - uses: ./.github/actions/nats-server

      # Before the tests (review point 1): `skip_no_bus` skips every bus test
      # when no interpreter imports the bus, and with the sync after the test
      # step CI skipped all of them and reported green. One `sync` for both
      # steps below.
      - name: sync the bus
        run: uv sync --locked --directory ../mcp

      # `CB_TESTRIG_REQUIRE_BUS=1` turns that skip into a failure: a silent
      # skip is what hid the ordering above, so CI asks for the bus explicitly.
      - name: tests
        run: uv run --locked --group dev pytest -q
        env:
          CB_TESTRIG_REQUIRE_BUS: "1"

      # The harness must run where the Lab does, and must be runnable where it
      # does not: the echo run proves the second half on every build.
      - name: echo run, no Lab and no server
        run: uv run --locked bus-testrig echo-run

      # `bus-run` drives the real server, so it needs the bus's own project
      # synced; the step above did that. A baseline that loses a frame or has an
      # unknown stub call exits non-zero (review point 2), so this also asserts
      # the plain run is clean. The faulted run is asked to lose *some* and
      # carry the rest (`--expect-loss`, `--every 3`): at `--every 1` everything
      # is lost, which a dead receiver also produces, so it could not tell the
      # two apart (review of #23).
      - name: run the bus through the rig
        run: |
          uv run --locked bus-testrig bus-run --count 20
          uv run --locked bus-testrig bus-run --count 20 --fault drop --after 1 --every 3 --expect-loss
        working-directory: testrig

      # The same path for a home over NATS (ADR-014 phase 1): a small run of the
      # baseline and every NATS fault, and one coordinator hard stop. Small on
      # purpose: the plan's 100 messages and 50 stops are the nightly job's below.
      # The take-over waits for the dead holder's presence to go stale (about
      # 90-150 s), which is the finding, so this step takes a few minutes.
      - name: run the bus over NATS through the rig
        run: |
          uv run --locked bus-testrig bus-run --transport nats --fault all --count 10 --summary
          uv run --locked bus-testrig coord-run --transport nats --stops 1 --sessions 2 --summary

      # Plan B piece 2, the roster from NATS (#252): a cut must tell no live agent
      # as gone. CB_PLANB_TEST is plan B's test switch, which the rig hands to its
      # sessions; the run exits 1 on a live agent told as gone, and on a run whose
      # roster was never checked.
      - name: nobody told as gone during a cut, the roster from NATS
        run: uv run --locked bus-testrig bus-run --transport nats --fault cut --count 20 --summary
        env:
          CB_PLANB_TEST: "2"

      # The probes drive the *real* bus code over the stub. A test of the stub's
      # own shape cannot see a difference between what it invents and what the
      # bus parses (review of #60: a top-level `custom_status` object against
      # Mattermost's JSON string in `props.customStatus`), so these run here and
      # fail on a gap instead of being a guard nobody executes.
      # `--directory ../mcp` also changes the working directory, so a relative
      # script path is looked for inside `mcp/`. The shell expands $(pwd) first;
      # the job's `working-directory` is `testrig`.
      - name: the stub passes the bus's own readers
        run: |
          uv run --directory ../mcp --with httpx python "$(pwd)/scripts/probe_status_shape.py"
          uv run --directory ../mcp --with httpx python "$(pwd)/scripts/stub_roundtrip.py"

      - name: a fault really changes the numbers
        run: uv run --locked python scripts/ci_fault_check.py

  # ADR-014 phase 4: 100 messages per fault and 50 hard stops of the coordinator,
  # over NATS. Each stop waits for the dead holder's presence to go stale (about
  # 90-150 s each), so the job is long; it runs nightly and on demand only.
  full-nats:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: testrig
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          enable-cache: true
      - uses: ./.github/actions/nats-server
      - name: sync the bus
        run: uv sync --locked --directory ../mcp
      - name: delivery, 100 messages per fault
        # The run's whole output goes to the step summary and the artifact even
        # when it fails (that run's numbers are what one needs), then the step
        # exits with the run's own status.
        run: |
          set -uo pipefail
          mkdir -p results
          rc=0
          uv run --locked bus-testrig bus-run --transport nats --fault all --count 100 --summary \
            | tee results/delivery.txt || rc=$?
          { echo; echo '## Delivery, 100 messages per fault'; echo '```'; cat results/delivery.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: told gone, every fault with the roster from NATS
        # Plan B piece 2 (#252): the delivery run again with CB_PLANB_TEST=2, each
        # send a TASK that names the receiver; `told gone` must be 0. Then one cut of
        # 120 s, longer than a presence stays fresh (90 s): the agents' presences are
        # old when the sessions come back.
        env:
          CB_PLANB_TEST: "2"
        run: |
          set -uo pipefail
          mkdir -p results
          rc=0
          uv run --locked bus-testrig bus-run --transport nats --fault all --count 100 --summary \
            | tee results/told-gone.txt || rc=$?
          uv run --locked bus-testrig bus-run --transport nats --fault cut --fault-sec 120 --count 100 --summary \
            | tee -a results/told-gone.txt || rc=$?
          { echo; echo '## Told gone, the roster from NATS (CB_PLANB_TEST=2)'; echo '```'; cat results/told-gone.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: 50 hard stops of the coordinator
        run: |
          set -uo pipefail
          mkdir -p results
          rc=0
          uv run --locked bus-testrig coord-run --transport nats --stops 50 --sessions 3 --summary \
            | tee results/coord.txt || rc=$?
          { echo; echo '## 50 hard stops of the coordinator'; echo '```'; cat results/coord.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: the night's numbers
        # The findings of a nightly run are read from the run page, not a log
        # nobody opens (review of #209, point 8): the tables in the step summary,
        # the full output as an artifact. `always()`: a failed run's numbers are
        # what one needs.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: full-nats-results
          path: testrig/results/
          if-no-files-found: warn
