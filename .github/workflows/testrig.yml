name: testrig

# The fault-run harness has its own project and its own job (condition 1 of
# the build order's approval): a move that touches mcp/pyproject.toml does not
# touch this, and a change here runs only here.

on:
  push:
    branches: [main]
    paths: ["testrig/**", ".github/workflows/testrig.yml"]
  pull_request:
    paths: ["testrig/**", ".github/workflows/testrig.yml"]

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testrig
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: ruff
        run: uvx ruff@0.17.2 check

      - name: tests
        run: uv run --extra dev pytest -q

      # The harness must run where the Lab does, and must be runnable where it
      # does not: the dry run proves the second half on every build.
      - name: dry run, no Lab and no server
        run: uv run bus-testrig dry-run

      - name: a fault really changes the numbers
        run: |
          set -euo pipefail
          out="$(uv run bus-testrig dry-run --fault drop --after 1 --count 10)"
          python3 - "$out" <<'PY'
          import json, sys
          m = json.loads(sys.argv[1])["measured"]
          assert m["loss"]["value"] > 0, m["loss"]
          assert m["device_approvals"]["status"] == "not_yet_measurable", m["device_approvals"]
          print("faulted run reports a loss and names what it cannot measure yet")
          PY
