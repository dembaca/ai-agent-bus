name: auth service

# Only services/auth/ and this file. The rest of the repository is covered by
# checks.yml; a change outside services/auth/ does not build this module and a
# change inside it does not build the plugin.
on:
  push:
    branches: [main]
    paths:
      - 'services/auth/**'
      - '.github/workflows/auth.yml'
  pull_request:
    paths:
      - 'services/auth/**'
      - '.github/workflows/auth.yml'
  # By hand, to publish the image of main again; the publish job below still
  # refuses any other branch.
  workflow_dispatch:

# Read-only for the whole workflow. Only the publish job asks for more, and it
# never runs for a pull request.
permissions:
  contents: read

defaults:
  run:
    working-directory: services/auth

jobs:
  build:
    name: go vet, go test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned by commit SHA with the version in a comment, as pages.yml does:
      # a moved tag cannot change what runs here.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: services/auth/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt wants these files formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: build
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/authd

      - name: image builds
        # The Dockerfile pins its base images by digest; this makes sure it
        # still builds after a change, without pushing anywhere.
        run: docker build --build-arg VERSION="ci-${GITHUB_SHA::7}" -t ai-agent-bus-auth:ci .

  publish:
    name: publish the image to GHCR
    # Only what is on main, and only after the tests above passed. Never for a
    # pull request: a PR (from a fork or not) gets no write token and no push.
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # One publish at a time: an older run must not reach the registry after a
    # newer one (the tag check narrows the window, this keeps it ordered).
    concurrency:
      group: publish-auth
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write        # push to ghcr.io with GITHUB_TOKEN, no PAT
      id-token: write        # sign the build provenance (Sigstore, OIDC)
      attestations: write    # store the provenance attestation
    env:
      IMAGE: ghcr.io/dembaca/ai-agent-bus-auth
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: version
        id: version
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: is this the newest build of these paths? (:main only then)
        id: tags
        # A run's tests finish in their own time, and each workflow is path
        # filtered: :main belongs to the newest commit of the image's own paths,
        # so an unrelated merge that lands while a build runs does not leave
        # :main behind. Only that commit moves :main; every build keeps its SHA
        # tag, and deployments name the digest anyway.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          newest() {
            for p in "$@"; do
              gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&path=${p}&per_page=1" \
                --jq '.[0] | "\(.commit.committer.date) \(.sha)"'
            done | sort | tail -1 | cut -d' ' -f2
          }
          head="$(newest services/auth)"
          tags="${IMAGE}:${GITHUB_SHA}"
          if [ "$head" = "$GITHUB_SHA" ]; then
            tags="${tags}"$'\n'"${IMAGE}:main"
            echo "main=true" >> "$GITHUB_OUTPUT"
            echo "this build is the newest of its paths: :main moves"
          else
            echo "main=false" >> "$GITHUB_OUTPUT"
            echo "the newest build of these paths is ${head}: only :${GITHUB_SHA} is tagged"
          fi
          { echo "list<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: services/auth
          file: services/auth/Dockerfile
          push: true
          build-args: |
            VERSION=ci-${{ steps.version.outputs.short }}
          # The full commit SHA is the tag that names a build; :main moves with
          # each merge, but only from the newest commit, and is a convenience
          # only. Deployments use the digest.
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: digest in the job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          MAIN: ${{ steps.tags.outputs.main }}
        run: |
          {
            echo "### Login service image"
            echo
            echo "Deploy by digest:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            if [ "${MAIN}" = "true" ]; then
              echo "Tags: \`${GITHUB_SHA}\`, \`main\` (moving)."
            else
              echo "Tags: \`${GITHUB_SHA}\` only: main moved on before this build finished, so \`:main\` names a newer image."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
