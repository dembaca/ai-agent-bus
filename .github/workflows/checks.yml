name: checks

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: adding or removing no-doc-change re-runs the doc map.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # Every job has a timeout-minutes so a hang fails in minutes rather than
  # holding the runner to GitHub's 6 h default. Each is a wide margin over the
  # job's usual run (in brackets), not a target: a slow runner must still pass.
  docs:
    name: docs in step with code
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~5 s
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doc-check diffs against the PR base

      - name: arc42 cross-section consistency
        run: python3 scripts/arc42-lint/arc42-lint.py docs/arc42 --strict --format github

      - name: doc map, RT ids, changelog
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NO_DOC_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'no-doc-change') }}
        run: |
          args=()
          [ -n "$BASE" ] && args+=(--base "$BASE")
          [ "$NO_DOC_CHANGE" = "true" ] && args+=(--skip-doc-map)
          python3 scripts/doc-check.py "${args[@]}"

  tests:
    runs-on: ubuntu-latest
    # The suite takes 7-8 min in CI. This bounds a hang (a stuck test once held
    # the runner to GitHub's 6 h default), with room for a slow runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: nats-server (the NATS transport tests run against the real server)
        # Official release, checked against a fixed sha256 (the release's SHA256SUMS for
        # nats-server-v2.15.3-linux-amd64.tar.gz). Keep the version in step with
        # services/auth/go.mod (ADR-014 point 16).
        run: |
          set -euo pipefail
          v=2.15.3
          sha=32e18c1e78d7ef4f86e483070eef3abb2647c3d4d67e29668077c7ad81da0797
          dir="$RUNNER_TEMP/nats-server"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/nats.tar.gz" \
            "https://github.com/nats-io/nats-server/releases/download/v${v}/nats-server-v${v}-linux-amd64.tar.gz"
          echo "$sha  $dir/nats.tar.gz" | sha256sum -c -
          tar -xzf "$dir/nats.tar.gz" -C "$dir" --strip-components=1 "nats-server-v${v}-linux-amd64/nats-server"
          "$dir/nats-server" --version
          echo "MM_NATS_SERVER=$dir/nats-server" >> "$GITHUB_ENV"
          echo "MM_TEST_NATS=1" >> "$GITHUB_ENV"
      - name: MCP server
        run: uv run --directory mcp pytest -q
      - name: hooks against a fake Mattermost
        run: uv run --directory mcp pytest -q ../tests/hooks

  mcp-python-311:
    name: MCP server on Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15   # the suite without the live NATS tests, ~2 min
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: the MCP server on the oldest Python pyproject allows
        # pyproject.toml's requires-python is >=3.11. #96 was a dataclass default
        # that only Python 3.12 accepts (a mappingproxy as a plain default), so
        # every 3.11 host failed at import. The live NATS tests are the tests
        # job's business; this job is about the interpreter.
        run: uv run --directory mcp --python 3.11 pytest -q

  opencode-plugin:
    name: OpenCode plugin (node, API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~20 s each
    strategy:
      fail-fast: false
      matrix:
        api: ["2.1.2", "2.4.0", "2.4.1"]   # both ends of the peer range, and the pinned one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The plugin's runtime imports are node: modules only, so the test needs no
      # install; the typecheck does, since it compiles against @opencode/plugin.
      - name: plugin glue against a fake hook API
        run: node --test opencode/test/plugin.test.ts
      # The peer range is >=2.1.2 <2.5, and the reader is told the plugin is
      # typechecked across it; compile against both ends, not only the pinned
      # dev version, or that sentence is not enforced.
      - name: plugin against the hook API it declares
        env:
          API: ${{ matrix.api }}
        run: |
          npm --prefix opencode ci --ignore-scripts
          npm --prefix opencode install --no-save --ignore-scripts --no-audit --no-fund "@opencode/plugin@$API"
          npm --prefix opencode run typecheck

  pi-extension:
    name: pi extension (node)
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~10 s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Type stripping runs the .ts as is; the extension imports only node: modules.
      - name: extension glue against a fake hook API
        run: node --test pi/test/extension.test.ts

  site:
    name: promo site builds (site/)
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~20 s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Same build as pages.yml, so a PR shows a broken site before main does.
      - name: typecheck and build
        working-directory: site
        run: |
          npm ci
          npm run typecheck
          npm run build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~45 s
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Warnings and errors only: info and style notes differ between
      # shellcheck versions, and the runner's is not the one on our machines.
      - name: shell scripts (shellcheck, .shellcheckrc)
        run: git ls-files -z '*.sh' '*.sh.example' | xargs -0 shellcheck -S warning
      - name: Python (ruff, ruff.toml)
        run: uvx ruff@0.17.2 check
      - name: MCP server types (mypy, mcp/pyproject.toml)
        run: uv run --directory mcp mypy
