name: checks

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: adding or removing no-doc-change re-runs the doc map.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # By hand, to run the suite of main again; the publish job below refuses a
  # pull request and a branch other than main, as the bridge's does.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every job has a timeout-minutes so a hang fails in minutes rather than
  # holding the runner to GitHub's 6 h default. Each is a wide margin over the
  # job's usual run (in brackets), not a target: a slow runner must still pass.
  docs:
    name: docs in step with code
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~5 s
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doc-check diffs against the PR base

      - name: arc42 cross-section consistency
        run: python3 scripts/arc42-lint/arc42-lint.py docs/arc42 --strict --format github

      - name: doc map, RT ids, changelog
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NO_DOC_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'no-doc-change') }}
        run: |
          args=()
          [ -n "$BASE" ] && args+=(--base "$BASE")
          [ "$NO_DOC_CHANGE" = "true" ] && args+=(--skip-doc-map)
          python3 scripts/doc-check.py "${args[@]}"

  tests:
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    # The suite takes 7-8 min in CI. This bounds a hang (a stuck test once held
    # the runner to GitHub's 6 h default), with room for a slow runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/nats-server
      - run: echo "MM_TEST_NATS=1" >> "$GITHUB_ENV"
      - name: MCP server
        run: uv run --directory mcp pytest -q
      - name: hooks against a fake Mattermost
        run: uv run --directory mcp pytest -q ../tests/hooks

  mcp-python-311:
    name: MCP server on Python 3.11
    needs: changes
    if: needs.changes.outputs.py == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15   # the suite without the live NATS tests, ~2 min
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: the MCP server on the oldest Python pyproject allows
        # pyproject.toml's requires-python is >=3.11. #96 was a dataclass default
        # that only Python 3.12 accepts (a mappingproxy as a plain default), so
        # every 3.11 host failed at import. The live NATS tests are the tests
        # job's business; this job is about the interpreter.
        #
        # Deselected: on 3.11 a TLS-first connect whose server answers in clear
        # waits its 2 s connect timeout instead of raising the SSL error at once.
        # The reason the caller logs is still the TLS one, only later; that test
        # is about the message, not about the interpreter.
        run: >-
          uv run --directory mcp --python 3.11 pytest -q
          --deselect tests/test_natsbus.py::test_a_server_that_does_not_speak_tls_first_is_named_in_the_log

  opencode-plugin:
    name: OpenCode plugin (node, API ${{ matrix.api }})
    needs: changes
    if: needs.changes.outputs.opencode == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~20 s each
    strategy:
      fail-fast: false
      matrix:
        api: ["2.1.2", "2.4.0", "2.4.1"]   # both ends of the peer range, and the pinned one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The plugin's runtime imports are node: modules only, so the test needs no
      # install; the typecheck does, since it compiles against @opencode/plugin.
      - name: plugin glue against a fake hook API
        run: node --test opencode/test/plugin.test.ts
      # The peer range is >=2.1.2 <2.5, and the reader is told the plugin is
      # typechecked across it; compile against both ends, not only the pinned
      # dev version, or that sentence is not enforced.
      - name: plugin against the hook API it declares
        env:
          API: ${{ matrix.api }}
        run: |
          npm --prefix opencode ci --ignore-scripts
          npm --prefix opencode install --no-save --ignore-scripts --no-audit --no-fund "@opencode/plugin@$API"
          npm --prefix opencode run typecheck

  pi-extension:
    name: pi extension (node)
    needs: changes
    if: needs.changes.outputs.pi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~10 s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Type stripping runs the .ts as is; the extension imports only node: modules.
      - name: extension glue against a fake hook API
        run: node --test pi/test/extension.test.ts

  site:
    name: promo site builds (site/)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~20 s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Same build as pages.yml, so a PR shows a broken site before main does.
      - name: typecheck and build
        working-directory: site
        run: |
          npm ci
          npm run typecheck
          npm run build

  console:
    name: operator console builds (console/web)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # like the site job
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: console/web/package-lock.json
      # Same build as the site: typecheck, the model's tests (vitest) and
      # build, so a PR shows a broken console before main does.
      - name: typecheck, test and build
        working-directory: console/web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  console-server:
    name: operator console server (console/server, real nats-server)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/nats-server
      - run: echo "MM_TEST_NATS=1" >> "$GITHUB_ENV"
      - name: console server
        run: |
          uv run --directory console/server pytest -q
          uv run --directory console/server --with mypy mypy src
      # The reviews' image findings, held by CI: the image builds and the
      # server starts and answers /healthz (the login keeps retrying its
      # discovery when the issuer is down, so a missing Keycloak in this
      # smoke is the reality the loop handles).
      - name: image builds, and the server starts
        run: |
          version="$(jq -r .version .claude-plugin/plugin.json)"
          docker build -t console-test -f console/server/Dockerfile \
            --build-arg VERSION="$version" \
            --build-arg REVISION="$GITHUB_SHA" .
          docker run -d --name console-test -p 127.0.0.1:8747:8747 \
            -e CB_CONSOLE_PUBLIC_URL=http://127.0.0.1:8747 \
            -e CB_CONSOLE_ISSUER=http://127.0.0.1:19999 \
            -e CB_CONSOLE_CLIENT_ID=smoke \
            -e CB_CONSOLE_OPERATOR_GROUP=operators \
            -e CB_CONSOLE_ADDR=0.0.0.0:8747 \
            -e CB_CONSOLE_NATS_URL=nats://127.0.0.1:4222 \
            console-test
          # /livez is liveness and answers 200 as soon as the server
          # listens; /healthz (readiness) stays 503 in this smoke by
          # design — waiting on it would burn the full loop
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8747/livez && break
            sleep 1
          done
          # /livez is liveness (200, NATS-less container and all); /healthz
          # is readiness and rightly answers 503 in this smoke, no NATS
          # server answering (RT-6.43: no seed, no reader before a login) —
          # an assertion both ways, not a curl that passed by chance
          status=0
          curl -fsS http://127.0.0.1:8747/livez | grep -q ok || status=1
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8747/healthz)
          [ "$code" = "503" ] || status=1
          curl -sS http://127.0.0.1:8747/healthz | grep -q "does not answer" || status=1
          # #182: the build the image was given, as /v1/me and /metrics state
          # it and the OCI labels carry it. A second run with the login off
          # (loopback only, so on the host's network): the stand-in operator
          docker run -d --name console-build --network host \
            -e CB_CONSOLE_PUBLIC_URL=http://127.0.0.1:8748 \
            -e CB_CONSOLE_LOGIN_OFF=1 \
            -e CB_CONSOLE_ADDR=127.0.0.1:8748 \
            -e CB_CONSOLE_NATS_URL=nats://127.0.0.1:4222 \
            console-test
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8748/livez >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8748/v1/me \
            | jq -e --arg v "$version" --arg r "$GITHUB_SHA" \
                '.build == {version: $v, revision: $r}' || status=1
          curl -fsS http://127.0.0.1:8748/metrics \
            | grep -qxF "choirbus_console_build_info{version=\"$version\",revision=\"$GITHUB_SHA\"} 1" || status=1
          labels="$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}} {{index .Config.Labels "org.opencontainers.image.revision"}}' console-test)"
          [ "$labels" = "$version $GITHUB_SHA" ] || status=1
          docker logs console-build 2>&1 | tail -20
          docker rm -f console-build
          docker logs console-test 2>&1 | tail -40
          docker rm -f console-test
          exit $status

  # Which areas this run touches, so a job runs only when something it reads
  # changed. A job of its own, with `if:` on the others (not a `paths:` filter on
  # the workflow): a skipped job counts as passed for a required check, and the
  # publish job below needs one answer for a push. `docs` and `lint` always run.
  #
  # A pull request is diffed against its base; a push to main and a manual run
  # run everything, as before. A changed file no area claims, and that is not
  # pure documentation, makes every job run. Runtime texts (skills/, the hooks,
  # the MCP server's instructions) are code.
  changes:
    name: which areas changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      py: ${{ steps.areas.outputs.py }}             # tests, MCP server on Python 3.11
      opencode: ${{ steps.areas.outputs.opencode }} # OpenCode plugin
      pi: ${{ steps.areas.outputs.pi }}             # pi extension
      site: ${{ steps.areas.outputs.site }}         # promo site
      console: ${{ steps.areas.outputs.console }}   # console web and console server
      publish: ${{ steps.areas.outputs.publish }}   # the console image (main only)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0   # the PR's base and a push's previous head, for the diff
      - name: git diff against the base or the previous head
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          py=false oc=false pi=false site=false con=false publish=false
          all() { py=true oc=true pi=true site=true con=true; }
          base=""
          [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          [ "$EVENT" = "push" ] && base="$PUSH_BEFORE"
          have_base=false
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            have_base=true
          fi
          files=""
          [ "$have_base" = true ] && files="$(git diff --name-only "$base" HEAD)"
          # the console image: console/ and mcp/ (its path dependency) or this file.
          # A manual run of main publishes on purpose, as bridge.yml's does; so does
          # a push whose previous head is gone.
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$have_base" != true ] ||
             printf '%s\n' "$files" | grep -qE '^(console/|mcp/|\.github/workflows/checks\.yml$)'; then
            publish=true
          fi
          if [ "$EVENT" != "pull_request" ] || [ "$have_base" != true ]; then
            all   # a push to main, a manual run, or no base to diff: everything
          else
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in
                .github/workflows/checks.yml) all ;;
                .github/actions/*) py=true; con=true ;;
                mcp/*) py=true; oc=true; pi=true; con=true ;;
                # the plugin's test reads bin/mm-agent-lib.sh; pi imports the plugin
                bin/*) py=true; oc=true; pi=true ;;
                opencode/*) oc=true; pi=true ;;
                pi/*) pi=true ;;
                # the console image reads the version from plugin.json
                .claude-plugin/*) py=true; con=true ;;
                hooks/*|adapters/*|skills/*|tests/*|scripts/*|pyproject*|uv.lock) py=true ;;
                # tests read these as text (Go sources, the NATS configuration example)
                services/*) py=true ;;
                site/*) site=true ;;
                console/*) con=true ;;
                # read by the hook tests and the spec tests
                docs/doc-map.toml|docs/env-names.md|docs/protocol.md|docs/arc42/09-*|docs/arc42/11-*) py=true ;;
                # pure documentation: the docs job is its check
                docs/*|CHANGELOG.md) ;;
                # no other path with a slash is claimed: it makes everything run
                */*) all ;;
                *.md) ;;
                # lint's own configuration
                ruff.toml|.shellcheckrc|.gitignore|LICENSE) ;;
                *) all ;;
              esac
            done <<< "$files"
          fi
          {
            echo "py=$py"; echo "opencode=$oc"; echo "pi=$pi"; echo "site=$site"
            echo "console=$con"; echo "publish=$publish"
          } | tee -a "${GITHUB_OUTPUT:-/dev/stdout}"

  # The console image for the lab pilot (ADR-015): built from the repository
  # root, because its Dockerfile copies console/web and console/fixtures. The
  # gate is this file's console jobs — a `needs` cannot reach across workflow
  # files, so this job lives here rather than in a workflow of its own.
  #
  # Read-only for the whole workflow; only this job asks for more, and it never
  # runs for a pull request.
  publish-console:
    name: publish the console image to GHCR
    needs: [console, console-server, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.publish == 'true'
    # One publish at a time: an older run must not move :main back after a
    # newer one.
    concurrency:
      group: publish-console
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write        # push to ghcr.io with GITHUB_TOKEN, no PAT
      id-token: write        # sign the build provenance (Sigstore, OIDC)
      attestations: write    # store the provenance attestation
    env:
      IMAGE: ghcr.io/dembaca/ai-agent-bus-console
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: is this the newest build of these paths? (:main only then)
        id: tags
        # A run's tests finish in their own time, and each workflow is path
        # filtered: :main belongs to the newest commit of the image's own paths,
        # so an unrelated merge that lands while a build runs does not leave
        # :main behind. Only that commit moves :main; every build keeps its SHA
        # tag, and deployments name the digest anyway.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          newest() {
            for p in "$@"; do
              gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&path=${p}&per_page=1" \
                --jq '.[0] | "\(.commit.committer.date) \(.sha)"'
            done | sort | tail -1 | cut -d' ' -f2
          }
          head="$(newest console mcp)"
          tags="${IMAGE}:${GITHUB_SHA}"
          if [ "$head" = "$GITHUB_SHA" ]; then
            tags="${tags}"$'\n'"${IMAGE}:main"
            echo "main=true" >> "$GITHUB_OUTPUT"
            echo "this build is the newest of its paths: :main moves"
          else
            echo "main=false" >> "$GITHUB_OUTPUT"
            echo "the newest build of these paths is ${head}: only :${GITHUB_SHA} is tagged"
          fi
          { echo "list<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: the release version (shown by the console, #182)
        id: version
        run: echo "version=$(jq -r .version .claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      - name: build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: console/server/Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          push: true
          # The full commit SHA is the tag that names a build; :main moves with
          # each merge, but only from the newest commit, and is a convenience
          # only. Deployments use the digest.
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: digest in the job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          MAIN: ${{ steps.tags.outputs.main }}
        run: |
          {
            echo "### Operator console image"
            echo
            echo "Deploy by digest:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            if [ "${MAIN}" = "true" ]; then
              echo "Tags: \`${GITHUB_SHA}\`, \`main\` (moving)."
            else
              echo "Tags: \`${GITHUB_SHA}\` only: main moved on before this build finished, so \`:main\` names a newer image."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # ~45 s
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Warnings and errors only: info and style notes differ between
      # shellcheck versions, and the runner's is not the one on our machines.
      - name: shell scripts (shellcheck, .shellcheckrc)
        run: git ls-files -z '*.sh' '*.sh.example' | xargs -0 shellcheck -S warning
      - name: Python (ruff, ruff.toml)
        run: uvx ruff@0.17.2 check
      - name: MCP server types (mypy, mcp/pyproject.toml)
        run: uv run --directory mcp mypy
