name: nats-server
description: >-
  The pinned nats-server for the NATS transport, checked against a fixed sha256,
  exported as CB_NATS_SERVER and MM_NATS_SERVER.

# One place for the pin (#218): the workflows that run the bus's NATS tests and
# the fault rig used to carry this block four times. Keep the version in step
# with services/auth/go.mod (ADR-014 point 16).

runs:
  using: composite
  steps:
    - name: fetch nats-server 2.15.3
      shell: bash
      run: |
        set -euo pipefail
        v=2.15.3
        sha=32e18c1e78d7ef4f86e483070eef3abb2647c3d4d67e29668077c7ad81da0797
        dir="$RUNNER_TEMP/nats-server"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/nats.tar.gz" \
          "https://github.com/nats-io/nats-server/releases/download/v${v}/nats-server-v${v}-linux-amd64.tar.gz"
        echo "$sha  $dir/nats.tar.gz" | sha256sum -c -
        tar -xzf "$dir/nats.tar.gz" -C "$dir" --strip-components=1 "nats-server-v${v}-linux-amd64/nats-server"
        "$dir/nats-server" --version
        echo "CB_NATS_SERVER=$dir/nats-server" >> "$GITHUB_ENV"
        # The old name too, as mcp/tests/test_natsbus.py still reads it (#169).
        echo "MM_NATS_SERVER=$dir/nats-server" >> "$GITHUB_ENV"
