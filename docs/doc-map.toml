# Which docs a code change has to touch.
#
# scripts/doc-check.py --base <ref> compares the branch with <ref>: for every
# rule whose `paths` match a changed file, at least one of its `docs` must have
# changed too. A change that really needs no doc update says so explicitly: the
# `no-doc-change` label on the PR (CI), or `--skip-doc-map` locally.
#
# Globs: fnmatch on repo-relative paths, `*` also matches `/`.
# A rule may add `exclude`, also fnmatch globs: a changed file that matches one of
# them is not the rule's business, even though `paths` matched it. Per rule on
# purpose, so one tree can leave out its tests without loosening another rule:
#
#   exclude = ["*_test.go", "*/testdata/*"]
#
# Keep the docs list short and specific: "any doc changed" proves nothing.

[[rule]]
name = "turn hooks: presence, drain, sign-off, listen window"
paths = ["hooks/*"]
docs = ["docs/arc42/06-runtime-view.md"]

[[rule]]
name = "host session hooks: lifecycle, registration"
paths = ["adapters/corral/*"]
docs = ["docs/arc42/06-runtime-view.md", "docs/arc42/07-deployment-view.md"]

[[rule]]
name = "shell CLI"
paths = ["bin/*"]
docs = [
  "docs/arc42/05-building-block-view.md",
  "docs/arc42/06-runtime-view.md",
  "docs/arc42/07-deployment-view.md",
]

[[rule]]
name = "MCP server: tools, inbox, instructions"
paths = ["mcp/src/*"]
docs = [
  "docs/arc42/03-context-and-scope.md",
  "docs/arc42/05-building-block-view.md",
  "docs/arc42/06-runtime-view.md",
  "docs/protocol.md",
]

[[rule]]
name = "operator console: browser app and server"
paths = ["console/*"]
docs = ["docs/arc42/09-architecture-decisions.md"]

[[rule]]
name = "OpenCode plugin: turn cycle in OpenCode sessions"
paths = ["opencode/*"]
docs = ["docs/arc42/06-runtime-view.md", "adapters/opencode.md"]

[[rule]]
name = "pi extension: turn cycle in pi sessions"
paths = ["pi/*"]
docs = ["docs/arc42/06-runtime-view.md", "adapters/pi.md"]

[[rule]]
name = "login service: configuration, health, image"
paths = ["services/auth/*"]
# Its own tests and fixtures do not change what the service does, so they do not
# ask for a doc. `*` covers `/`, so these need no `**`. Per rule on purpose: the
# harness plugins' tests sit in the same tree as the code they drive and stay
# covered by their rules.
exclude = ["*_test.go", "*/testdata/*"]
docs = [
  "docs/arc42/05-building-block-view.md",
  "docs/arc42/07-deployment-view.md",
]

[[rule]]
name = "central bridge: configuration, health, image"
paths = ["services/bridge/*"]
# Own tests and fixtures need no doc, as for the login service above.
exclude = ["*_test.go", "*/testdata/*"]
docs = [
  "docs/arc42/05-building-block-view.md",
  "docs/arc42/07-deployment-view.md",
]

[[rule]]
name = "fault-run rig: transports, faults, measurands"
paths = ["testrig/*"]
# The rig measures ADR-014's phase 1 and 4 rows, so its decision record says what it
# runs and what it found. Its own tests and its README are not the decision's
# business (the README describes the rig and changes with it).
exclude = ["testrig/tests/*", "testrig/README.md"]
docs = ["docs/arc42/09-architecture-decisions.md"]

[[rule]]
name = "version bump"
paths = [".claude-plugin/plugin.json"]
docs = ["CHANGELOG.md"]
