[project]
name = "console-server"
version = "0.1.0"
description = "The operator console's server (ADR-015 pilot): reads the NATS homes' presence and crown, serves the browser app"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mattermost-ai-agent-bus",
    "httpx>=0.27",
    "cryptography>=42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/console_server"]

[tool.uv.sources]
mattermost-ai-agent-bus = { path = "../../mcp", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "anyio>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.mypy]
python_version = "3.11"
# the mcp package ships no py.typed marker (its own repo checks it):
# import it as an untyped dependency, never skip its use unexamined
[[tool.mypy.overrides]]
module = "mattermost_ai_agent_bus.*"
ignore_missing_imports = true
