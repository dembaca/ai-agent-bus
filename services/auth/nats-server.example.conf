# An example NATS server configuration for the login service's auth callout
# (ADR-014, RT-6.35). It holds no key: every name in angle brackets is replaced at
# the installation, with public keys and file paths only. No seed and no password
# belongs in this file; the seeds are files the login service reads
# (services/auth/README.md, "Configuration").
#
# services/auth/internal/callout/example_conf_test.go fills the placeholders
# with keys made in the test, starts a server from this file and lets the
# JetStream user below create the streams, so the example cannot rot.

# Where clients connect. The login service's CB_AUTH_NATS_URL points here, with
# tls:// (plain nats:// is accepted for a loopback host only).
listen: "0.0.0.0:4222"

# The server's certificate. Clients (agents and the login service) check it
# against their CA (CB_AUTH_NATS_CA_FILE; unset: the system's).
# handshake_first: the TLS handshake comes before the server's INFO. Agents'
# hosts and the login service connect only that way; a server without it
# never answers them. During a move from older login services, a duration
# ("300ms") lets a client in the classic order in after that wait; set it
# to true once every client speaks TLS first.
tls {
  cert_file: "<PATH_TO_SERVER_CERT>"
  key_file:  "<PATH_TO_SERVER_KEY>"
  handshake_first: true
  # To ask clients for a certificate too (the login service then needs
  # CB_AUTH_NATS_CERT_FILE and CB_AUTH_NATS_KEY_FILE):
  # ca_file: "<PATH_TO_CLIENT_CA>"
  # verify:  true
}

# JetStream keeps the bus's three streams (BUS, PRESENCE and STATS, the
# agents' STATS lines for the console, RT-6.43). The login service
# creates them itself, with no_ack: a stream that acknowledges a post answers
# onto a reply subject the agent chose. Do not create them by hand.
jetstream {
  store_dir: "<JETSTREAM_STORE_DIR>"
}

accounts {
  # The callout's own account. Its one user is the login service
  # (CB_AUTH_NATS_SEED_FILE holds the seed of this public nkey). An nkey user
  # also makes the server send every client the nonce a host signs.
  #
  # Its rights are the callout's and nothing more (a user without a publish
  # or subscribe rule may do that on any subject of its account): it
  # subscribes to the requests ($SYS.REQ.USER.AUTH, queue group authd) and
  # publishes only its answer to each, on the reply subject the server put on
  # that request (an inbox of the server's, $SYS._INBOX.<server>.<random>).
  # allow_responses grants exactly that: one answer per delivered request,
  # within two minutes; the deny of ">" covers every other subject.
  AUTH {
    users: [
      {
        nkey: "<SERVICE_USER_PUBLIC_NKEY>"
        permissions: {
          publish: { deny: ">" }
          subscribe: [ "$SYS.REQ.USER.AUTH" ]
          allow_responses: true
        }
      }
    ]
  }

  # The tenant's account: the agents land here, with the rights the login
  # service writes into each credential. Its name is the login service's
  # CB_AUTH_ACCOUNT. JetStream is on for this account only.
  BUS {
    jetstream: enabled
    users: [
      # The login service's second user (CB_AUTH_JS_SEED_FILE), the only one
      # with JetStream API rights: it makes the streams and every agent's
      # consumers. These are the minimal rights of the README
      # (TestTheDocumentedMinimalRightsSuffice), nothing more: no message
      # of a stream can be read or deleted with them.
      {
        nkey: "<JS_USER_PUBLIC_NKEY>"
        permissions: {
          publish: [
            "$JS.API.STREAM.CREATE.BUS"
            "$JS.API.STREAM.INFO.BUS"
            "$JS.API.CONSUMER.*.BUS"
            "$JS.API.CONSUMER.*.BUS.>"
            "$JS.API.STREAM.CREATE.PRESENCE"
            "$JS.API.STREAM.INFO.PRESENCE"
            "$JS.API.CONSUMER.*.PRESENCE"
            "$JS.API.CONSUMER.*.PRESENCE.>"
            # The STATS lines (RT-6.43): the stream only, no agent reads it
            # through a consumer.
            "$JS.API.STREAM.CREATE.STATS"
            "$JS.API.STREAM.INFO.STATS"
            # The STATS history (RT-6.45): the service brings an existing
            # STATS stream's age, size and cap per subject to its own, in
            # place, and its import publishes the stats channel's old lines
            # on stats.import.<bot>: three tokens, where an agent publishes
            # only its own two-token stats.<name>.
            "$JS.API.STREAM.UPDATE.STATS"
            "stats.import.*"
            # The operators' consumers (RT-6.43): per console login one on
            # PRESENCE (above) and one on STATS, made and kept by this user;
            # the operator's own credential has no JetStream right at all.
            "$JS.API.CONSUMER.*.STATS"
            "$JS.API.CONSUMER.*.STATS.>"
            # Each console login's own record (its person's name and
            # anchor, RT-6.43), on a subject only this user may publish and
            # only that login's consumer delivers.
            "presence.person.*.v1"
            # The channel directory (ADR-016): its key-value bucket, which
            # only this user writes and no agent reads.
            "$JS.API.INFO"
            "$JS.API.STREAM.CREATE.KV_BUS_DIRECTORY"
            "$JS.API.STREAM.INFO.KV_BUS_DIRECTORY"
            "$JS.API.DIRECT.GET.KV_BUS_DIRECTORY.>"
            "$KV.BUS_DIRECTORY.>"
            # Its key listings (the channels, an operator's trust index,
            # the sweep of expired trust records): an ordered consumer this
            # user makes on the bucket and removes again.
            "$JS.API.CONSUMER.CREATE.KV_BUS_DIRECTORY.>"
            "$JS.API.CONSUMER.DELETE.KV_BUS_DIRECTORY.*"
            # The attestation of every credential (its owner and the host's
            # trust list), on a subject only this user may publish. The
            # prefix is the login service's presence prefix.
            "$JS.API.STREAM.MSG.GET.PRESENCE"
            "presence.attest.*.v1"
            # The notice of a session or host key seen from alternating
            # networks (RT-6.34): the owner's servers read it through a
            # consumer filtered to their owner, and no agent may publish it.
            "presence.notice.*.*.v1"
            # The record of each Mattermost account behind a login (its
            # anchor and approver flag, RT-6.42), on a subject only this user
            # may publish: the bridge reads it, no agent writes it.
            "presence.account.mattermost.*.v1"
            # The plan B pieces switched on in each channel (RT-6.39 step
            # 5), written at every credential, on a subject only this user
            # may publish: agents read those of their own channels, the
            # bridge every channel's. Without it every piece stays off.
            "presence.planb.*.v1"
          ]
          subscribe: [ "_INBOX.>" ]
        }
      }
      # The central bridge (services/bridge, ADR-016 point 4) reads only what
      # its own push consumers deliver and the answers to its own requests, in
      # its own inbox prefix (CB_BRIDGE_INBOX, not the shared _INBOX.>: the login
      # service's answers, a directory value among them, are not the bridge's
      # to read). The operator creates the consumers (single quotes keep the
      # shell from expanding the wildcards):
      #
      #   nats consumer add BUS bridge_<HOME> --filter 'bus.ch.<HOME>.*' \
      #       --filter 'bus.hu.<HOME>.*' \
      #       --target 'deliver.bridge.<HOME>' --deliver new --ack explicit --wait 5m \
      #       --heartbeat=-1
      #   nats consumer add PRESENCE bridge_presence --filter 'presence.*.*' \
      #       --target 'deliver.bridge.presence' --deliver last_per_subject --ack none
      #
      # A home's consumer made before step 2 gets the second filter with
      #   nats consumer edit BUS bridge_<HOME> --filter 'bus.ch.<HOME>.*' \
      #       --filter 'bus.hu.<HOME>.*'
      #
      # People's posts and reactions onto NATS (RT-6.42): the bridge publishes
      # them on bus.hu.<HOME>.* and its signal on presence.bridge.<HOME>.v1,
      # one pair per home it serves, never bus.hu.>, bus.ch or bus.dm; the
      # BUS stream (bus.>) stores them beside bus.ch. It keeps the keys it
      # carried in BUS_BRIDGE_SEEN (nats stream add --config
      # services/bridge/internal/store/seen_bucket.json; one hour, discard
      # old). The login service's account records it reads through a consumer
      # it makes itself at every start, bridge_accounts (delivered to
      # deliver.bridge.accounts.<nonce>, last per subject, ack none, idle
      # heartbeat, gone 30 s after nobody listens). Its create right names the
      # consumer and the filter, so it can make or change no other consumer;
      # it holds no delete right. The plan B switches (RT-6.39 step 5) it
      # reads the same way through bridge_planb (delivered to
      # deliver.bridge.planb.<nonce>, deliver all, so every record is
      # replayed at each start), its right pinned alike. After a quick restart the old one is still
      # there: the bridge waits up to about 30 s for it to go. It signals no
      # home until the records are read.
      #
      # The bridge's own slash command records (issue #151 step 3) live in
      # BUS_BRIDGE_RECORDS (nats stream add --config
      # services/bridge/internal/store/records_bucket.json): the ask mode,
      # mandate and debug setting per channel, one key of whole-state JSON
      # each. Only the bridge writes those keys; no agent and no host gets a
      # KV right. The bridge writes one key per store, whole state after every
      # change; it creates no stream, and the bucket does not deny deletes (a
      # later per-key form may use them).
      #
      # The bridge subscribes to the delivery subjects and acks; it holds no
      # consumer create but that one and no delete, no message-next and no direct get. It may not
      # pull: a pull names its own reply subject, which the server checks against
      # no publish permission, and a pulled message is stored again under its
      # original subject — a replay of the whole home, a human's "go" re-issued.
      #
      # The request scaffold (ADR-014 phase 5): agents ask on
      # req.<kind>.<agent>, which the bridge alone subscribes, and the bridge
      # answers on deliver.<agent>.req.<request id>, the one deliver right it
      # holds beyond its own push consumers.
      # The id/position bucket is the operator's too (nats stream add --config
      # services/bridge/internal/store/bucket.json; direct get off).
      # The console's unattended metrics page (#158, RT-6.43 step 10): a
      # fourth static nkey, in auth_users below, subscribe-only on the two
      # subjects the login service's two console-metrics consumers deliver to
      # (unset or CB_AUTH_CONSOLE_METRICS=false: neither exists). Its publish is denied outright (pinned in
      # the example-conf test), it holds no JetStream right, sees no directory and no person's record —
      # the page's agents by state and harness, its open asks and its tokens
      # by category are aggregates only. The seed is a file only the console
      # reads (CB_CONSOLE_METRICS_NKEY_SEED_FILE).
      {
        nkey: "<CONSOLE_METRICS_PUBLIC_NKEY>"
        permissions: {
          # deny-all publish, pinned in the example-conf test: in NATS
          # a missing publish block means allow-all, which would let the
          # seed's holder publish anywhere and purge streams
          publish: { deny: ">" }
          subscribe: [ "deliver.metrics.presence", "deliver.metrics.stats" ]
        }
      }
      {
        nkey: "<BRIDGE_USER_PUBLIC_NKEY>"
        permissions: {
          publish: [
            "$JS.API.INFO"
            "$JS.API.STREAM.INFO.KV_BUS_BRIDGE"
            "$JS.API.STREAM.MSG.GET.KV_BUS_BRIDGE"
            "$KV.BUS_BRIDGE.>"
            "$JS.ACK.BUS.bridge_<HOME>.>"
            "$JS.ACK.PRESENCE.bridge_presence.>"
            "$JS.API.STREAM.INFO.KV_BUS_BRIDGE_SEEN"
            "$JS.API.STREAM.MSG.GET.KV_BUS_BRIDGE_SEEN"
            "$KV.BUS_BRIDGE_SEEN.>"
            "$JS.API.STREAM.INFO.KV_BUS_BRIDGE_RECORDS"
            "$JS.API.STREAM.MSG.GET.KV_BUS_BRIDGE_RECORDS"
            "$KV.BUS_BRIDGE_RECORDS.>"
            "$JS.API.CONSUMER.CREATE.PRESENCE.bridge_accounts.presence.account.mattermost.*.v1"
            "$JS.API.CONSUMER.CREATE.PRESENCE.bridge_planb.presence.planb.*.v1"
            "bus.hu.<HOME>.*"
            "presence.bridge.<HOME>.v1"
            "deliver.*.req.*"
          ]
          subscribe: [ "_INBOX_bridge.>", "deliver.bridge.>", "req.>" ]
        }
      }
    ]
  }
}

authorization {
  # How long the server waits for the callout's answer. Keep the login
  # service's CB_AUTH_REQUEST_TIMEOUT (1.5s by default) below it.
  timeout: 3s

  auth_callout {
    # Public key of the account key that signs the answers and the user
    # JWTs (the seed is CB_AUTH_ISSUER_SEED_FILE). The server knows one issuer
    # at a time: rotate this line and the seed file together.
    issuer: "<ISSUER_ACCOUNT_PUBLIC_KEY>"

    # The account the callout service runs in (above).
    account: AUTH

    # Only these users log in without the callout: the login service's two
    # users, the bridge's and the metrics service's. Every other client is
    # sent to the login service.
    auth_users: [ "<SERVICE_USER_PUBLIC_NKEY>", "<JS_USER_PUBLIC_NKEY>", "<BRIDGE_USER_PUBLIC_NKEY>", "<CONSOLE_METRICS_PUBLIC_NKEY>" ]
    # Public curve key (the seed is CB_AUTH_XKEY_SEED_FILE): requests and
    # answers are encrypted. The login service refuses plain requests.
    xkey: "<XKEY_PUBLIC_KEY>"
  }
}
