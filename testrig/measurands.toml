# The measurands of the fault runs, in one place.
#
# Every entry has a fixed `id` and a free `name` (points 8 of the review):
# the harness computes and reports by `id`, and only the report prints `name`.
# Renaming therefore changes what a human reads, never what the code does,
# and the match with another measurement plan is a rename, not a rebuild.
#
# `source` cites the acceptance row of ADR-014 (phase 4) a measurand belongs
# to, so that a measurand is never invented here: the run measures what the
# acceptance will compare, and nothing else.
#
# `status`:
#   measured            the harness computes it from a run
#   not_yet_measurable  this bus cannot produce it yet; reported as null with
#                       `why`, so the report keeps the same shape either way
#
# `unit` is printed verbatim. Frames, not "posts": what a run sends through a
# message channel is a frame (point 15 of the review).

# The run plan, from ADR-014 phase 1 (the fault harness: kill the MCP server,
# cut the network, hard-stop the coordinator, resume a session, restart NATS) and
# phase 4 (the delivery and the roles-and-coordinator rows of its acceptance),
# docs/arc42/09-architecture-decisions.md. A value that ADR-014 does not define
# stays `"open"` here: a number invented in this file would end up in a report as
# if the plan had asked for it, and the tolerance decides dembaca, not the harness.
[plan]
messages_per_run = 100          # delivery row: 100 messages per run, under fault
runs_per_fault = 10             # proposal of the plan, "at least 10 runs per fault"
hard_stops = 50                 # coordinator row: 50 hard stops
human_posts = 100               # coordinator row: 100 human posts under fault
takeover_target_sec = 30        # coordinator row: the new bus's target, not today's
tolerance = "open"              # gap 1: the plan defines no "no worse than today"
wait_start = "open"             # gap 1: where a wait begins
wait_end = "open"               # gap 1: where it ends
gap = "ADR-014 phase 4 defines no tolerance for no worse than today; the tolerance is dembaca's decision"
# Both adapters time at the same points — send time at the tool, receive time at
# the receiver's ingress — as a *proposal* of the plan, not a decision.
measurement_points = "proposal: send time at the tool, receive time at the receiver's ingress"

[[measurand]]
id = "loss"
name = "Loss"
source = "Delivery, ADR-014 phase 4 (bus-run, on Mattermost and with --transport nats)"
unit = "frames"
status = "measured"
what = "Frames a run sent that never reached the receiving side."

[[measurand]]
id = "latency_p50"
name = "Latency, median"
source = "Delivery, ADR-014 phase 4 (95th percentile wait no worse than today)"
unit = "ms"
status = "measured"
what = "Median time from send to arrival at the receiver."

[[measurand]]
id = "latency_p95"
name = "Latency, 95th percentile"
source = "Delivery, ADR-014 phase 4 (bus-run, on Mattermost and with --transport nats)"
unit = "ms"
status = "measured"
what = "95th percentile time from send to arrival at the receiver."

[[measurand]]
id = "duplicates"
name = "Duplicates"
source = "Delivery, ADR-014 phase 4 (nothing handled twice)"
unit = "frames"
status = "measured"
what = "Frames that arrived more than once at the receiver."

[[measurand]]
id = "takeover_p95"
name = "Coordinator take-over, 95th percentile"
source = "Roles and coordinator, ADR-014 phase 4 (50 hard stops; 30 s is a new target, not today's)"
unit = "s"
status = "measured"
# Measured, but only by `coord-run`: a delivery run stages no hard stop and reports
# null with this reason.
why = "Measured by coord-run only (hard stops of the crown holder); a delivery run stages no hard stop."
what = "95th percentile time from a hard stop (SIGKILL) of the coordinator to a survivor's crown log saying it holds the crown."

[[measurand]]
id = "handled_twice_or_missing"
name = "Events handled twice or not at all"
source = "Roles and coordinator, ADR-014 phase 4"
unit = "events"
status = "not_yet_measurable"
why = "coord-run stages the take-over but no events for the coordinator to handle across it; that needs the human posts of human_posts_not_handled_once."
what = "Coordinator events handled twice or not at all after a take-over."

[[measurand]]
id = "device_approvals"
name = "Device approvals"
source = "Device approvals, ADR-014 phase 4"
unit = "approvals"
status = "not_yet_measurable"
why = "Today's bus has no device approval; it arrives with the login service on the NATS side."
what = "How often a human had to approve a login during a run."

[[measurand]]
id = "forgeries_refused"
name = "Forgery cases refused"
source = "Identity, ADR-014 phase 4"
unit = "cases"
status = "not_yet_measurable"
why = "The forgery cases need the login service and the NATS permission model."
what = "Forgery and replay cases refused out of those tried."

# The plan's coordinator row also asks for 100 human posts under fault and, per
# post, how often it was handled (0, 1, more than once). One row, because the
# acceptance reads it as one number: the count that is not exactly 1.
[[measurand]]
id = "human_posts_not_handled_once"
name = "Human posts handled zero or several times"
source = "Roles and coordinator, ADR-014 phase 4 (100 human posts under fault)"
unit = "posts"
status = "not_yet_measurable"
why = "The rig fault the socket of one bot's inbox, not 100 human posts; counting them needs a human (or a script) posting into the same run."
what = "Human posts out of 100 under fault that were handled zero times or more than once."

# Row 7 of the plan, a proposal: approvals counted per kind. A is the first
# approval, B one after resuming (target 0), C one after the refresh token
# expired, D the renewal of the NATS credential (must be 0). Measured in daily
# use, never in the rig, so it is one row that carries all four kinds.
[[measurand]]
id = "device_approvals_by_kind"
name = "Device approvals by kind (A first, B after resume, C after refresh expiry, D NATS renewal)"
source = "Device approvals, ADR-014 phase 4, row 7 (proposal)"
unit = "approvals"
status = "not_yet_measurable"
why = "The plan measures this in daily use only, not in the rig; B targets 0 and D must be 0."
what = "Approvals of kind A (first), B (after resume, target 0), C (after refresh expiry) and D (NATS credential renewal, must be 0)."

# The plan names four rows the rig cannot measure at all. They are listed so
# the report keeps one shape before and after the switch, each with its reason
# rather than a zero that would read as a measurement.
[[measurand]]
id = "lockout_within_15_min"
name = "Lockout takes effect within 15 minutes"
source = "Emergency brake, ADR-014 phase 4"
unit = "s"
status = "not_yet_measurable"
why = "No switch and no credential lifetime to wait on in the rig; it needs the login service and NATS."
what = "Time from the emergency brake to a stopped agent's access ending (target: within 15 minutes)."

[[measurand]]
id = "retention_14_days"
name = "History kept for 14 days"
source = "Retention, ADR-014 phase 4"
unit = "days"
status = "not_yet_measurable"
why = "Fourteen days cannot be waited out in a run; it is a JetStream setting to inspect, not a rig measurement."
what = "How far back an agent can read history after reconnecting (target: 14 days)."

[[measurand]]
id = "return_path_via_switch"
name = "Return path through the switch"
source = "Switch, ADR-014 phase 4"
unit = "cases"
status = "not_yet_measurable"
why = "The switch back to Mattermost belongs to the login service and the NATS adapter, neither of which the rig drives."
what = "Cases in which a home switched back to Mattermost still delivers, without loss."

[[measurand]]
id = "mirroring_for_old_plugins"
name = "Mirroring for older plugins"
source = "Migration, ADR-014 phase 4"
unit = "cases"
status = "not_yet_measurable"
why = "Older plugins run against a bus the rig does not start; mirroring is a property of the running deployment."
what = "Cases in which an older plugin still reads what it expects while a home runs on NATS."

