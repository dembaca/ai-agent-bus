[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent-bus-testrig"
version = "0.1.0"
description = "Fault-run harness for the agent bus: injects failures, measures what the build order compares"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dembaca" }]
# The bus itself is installed from the same checkout by path, not from PyPI:
# the harness measures this code, never a released copy of it.
dependencies = [
  "httpx>=0.27",
  "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.17.2"]

[project.scripts]
bus-testrig = "bus_testrig.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bus_testrig"]

# The same mode the bus's own tests use (mcp/pyproject.toml).
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
