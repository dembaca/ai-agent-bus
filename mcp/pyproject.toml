[project]
name = "mattermost-ai-agent-bus"
version = "0.104.0"
description = "AI agent bus MCP server (chat: Mattermost) (session + WebSocket inbox)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dembaca" }]
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27",
  "websockets>=13.0",
  "cryptography>=42",
  "nkeys>=0.2",
  # natsbus's WebSocketTransport subclass copies its __init__: it matches this pin, recheck on update.
  # natsbus also reads nats-py's private Client._reading_task, Client._subs,
  # Subscription._wait_for_msgs_task and sets Client._public_nkey and Client._transport
  # (the silent-close watch of #221, the host key, the WebSocket subclass): on an upgrade,
  # rerun on purpose
  # test_a_connection_closed_without_its_callbacks_still_reconnects
  # and test_the_nats_py_private_fields_the_bus_relies_on_exist.
  "nats-py==2.16.0",
  # nats-py's WebSocket transport (ws://, wss://, RT-6.36); imported only then
  "aiohttp>=3.14",
]

[project.scripts]
mattermost-ai-agent-bus-mcp = "mattermost_ai_agent_bus.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "release_segment: keep the version segment of the status text (RT-6.30)",
  "keycloak: runs against a real Keycloak container, skipped without docker (RT-6.34)",
]

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

# The server (src) and the tests' port fake (tests/fakes.py); the other tests are
# not type-checked. strict covers disallow_untyped_defs, warn_return_any and
# warn_unused_ignores, among others.
[tool.mypy]
files = ["src", "tests/fakes.py"]
python_version = "3.11"
strict = true

# nkeys ships no type information.
[[tool.mypy.overrides]]
module = "nkeys"
ignore_missing_imports = true
